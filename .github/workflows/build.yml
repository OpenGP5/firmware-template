# Build the firmware on every push and pull request; on a tag like v1.0.0, also publish a release with the image.
name: build
on:
  push:
  pull_request:
permissions:
  contents: write                       # (only used to publish a release from a tag)
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: The control-processor compiler's 32-bit C library; Pillow for the simulator's screens
        run: sudo apt-get update && sudo apt-get install -y libc6-i386 python3-pil
      - uses: actions/cache@v4
        with:
          path: opengp5/fw-build
          key: toolchain-${{ runner.os }}-${{ hashFiles('opengp5/release/setup-toolchain.sh') }}
      - name: Compilers (pinned, checksum-checked)
        run: opengp5/release/setup-toolchain.sh
      - name: Test in the simulator
        run: ./test.sh
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/GP-5_*.bin
            build/sim/*.png
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/GP-5_*.bin --title "$GITHUB_REF_NAME" --generate-notes
